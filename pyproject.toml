[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seif-trading-brain"
version = "0.1.0"
description = "Research-first, brain-inspired trading framework for Alpaca with PyTorch-first numerics."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SETAI" }]
dependencies = [
  "alpaca-py>=0.42.0",
  "numpy>=1.26.0",
  "pydantic>=2.7.0",
  # alpaca-py imports pytz (alpaca/data/requests.py) but does not declare it;
  # pandas 3.x no longer pulls pytz in transitively, so declare it here.
  "pytz>=2024.1",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.1",
  "structlog>=24.1.0",
  "torch>=2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]
gui = [
  "PySide6>=6.6.0",
]

[project.scripts]
seif-brain = "src.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default run skips slow tests. Use `pytest -m slow` to run only slow ones,
# or `pytest -m ""` to run everything.
addopts = "-m 'not slow'"
markers = [
  "slow: long-running tests (real-data training, full sweeps, end-to-end). Skipped by default.",
]

