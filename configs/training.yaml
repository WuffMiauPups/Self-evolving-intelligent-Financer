# Training-specific overrides on top of default.yaml.
# Only settings that DIFFER from default.yaml belong here.
# Everything else inherits from default.yaml.

training:
  # State + future-path design (training-specific horizons)
  forward_horizons: [1, 5, 15]
  primary_direction_horizon: 15
  auxiliary_horizons: [30, 60]
  label_smoothing: 0.05
  collapse_warning_thresholds:
    long_prediction_floor: 0.08
    minority_recall_floor: 0.15
