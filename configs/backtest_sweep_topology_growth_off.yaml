# Sweep: topology growth OFF.
#
# Freezes the memory bank's dynamic unit population at whatever the
# persisted bank has when the run starts.  Use this to measure whether
# online unit insertion + splits are helping or hurting.
#
# Disables BOTH relevant flags (root + nested) to match the behavior of
# the Runtime-tab "Topology growth" toggle.
memory:
  dynamic_growth_enabled: false
  topology_growth:
    enabled: false
