broker:
  paper: true
  live_enabled: false
  confirm_live: false

device:
  # Disabled for paper diagnostics: inference was producing confidence=0.0
  # exactly, consistent with FP16 sigmoid underflow under autocast. Run
  # paper in FP32 while we diagnose the val-vs-paper output divergence.
  use_amp: false

runtime:
  # 0 = unbounded paper runtime (run until operator stops it or fatal error).
  max_runtime_steps: 0
  decision_interval_sec: 1.0
  max_data_staleness_sec: 1200
  allowed_sessions: ["regular"]
  regime_hysteresis_enabled: true
  market_priors_enabled: true

model:
  checkpoint_path: checkpoints/brain.pt

# (The old memory block only toggled fields deleted with the fusion /
# Hopfield machinery in the Great Simplification; memory settings now
# inherit entirely from default.yaml.)

risk:
  kill_switch: false
  # MUST exceed the bar period (5Min = 300s): a bar's timestamp is its
  # bucket START, so it ages to 300s by the time the bucket closes — that
  # is normal data, not stale data. At 180s the 2026-07-15 paper run
  # blocked 56% of all decisions with stale_data (the MASTER_PLAN §3 ⟲1
  # runbook names stale_data domination as a FAILING verify criterion).
  # 420s = one full bar + 120s slack for late delivery; a genuinely dead
  # feed (> 7 min) still halts trading.
  stale_data_sec: 420
  max_spread_bps: 200.0
  # Trade gating is EV-based (risk_manager computes
  # confidence * expected_gain_bps - (1-confidence) * expected_loss_bps - cost_bps).
  # On an undertrained brain the risk head's MFE/MAE predictions are noise,
  # so EV typically lands at 0 and the runtime correctly stays parked.
  # This is the same "honest behaviour on an undertrained brain" that the
  # old 0.55 min_trade_confidence achieved — just without a magic threshold.
