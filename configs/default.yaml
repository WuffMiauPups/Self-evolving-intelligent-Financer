app_name: seif_trading_brain

logging:
  level: INFO
  json: false
  file_enabled: true
  file_path: logs/seif_runtime.log

device:
  preferred: auto
  use_amp: false
  matmul_precision: high

broker:
  provider: alpaca
  paper: true
  live_enabled: false
  confirm_live: false
  require_account_match: true
  base_url: https://paper-api.alpaca.markets
  data_feed: iex
  polling_interval_sec: 2.0
  mock_data_on_missing_credentials: true

data:
  symbols:
    - AAPL
    - MSFT
  timeframe: 1Min
  start_date: 2022-01-01
  end_date: null
  cache_dir: artifacts/historical
  force_refresh: false
  max_missing_gap_handling: warn
  timezone_normalization: UTC

runtime:
  symbols:
    - AAPL
  timeframe: 1Min
  warmup_bars: 64
  decision_interval_sec: 2.0
  max_runtime_steps: 50
  state_reset_gap_sec: 300
  require_startup_reconciliation: true
  block_on_reconciliation_mismatch: true
  allowed_sessions: ["regular"]
  allow_prepost: false
  max_data_staleness_sec: 30
  block_on_backwards_time: true
  block_on_data_gap: true
  block_on_symbol_ineligible: false
  require_market_open: true

features:
  windows:
    short: 5
    medium: 20
    long: 60
  volatility_windows: [5, 10, 20]
  momentum_windows: [3, 5, 10]
  volume_windows: [5, 20]
  epsilon: 1.0e-6
  branch_feature_prefixes:
    trend: ["return_", "log_return_", "momentum_"]
    volatility: ["volatility_", "range_", "body_", "upper_wick_", "lower_wick_"]
    volume: ["volume_", "volume_z_", "volume_change_"]
    regime: ["regime_"]

model:
  feature_dim_hint: 32
  branch_hidden_dim: 32
  branch_output_dim: 24
  branch_depth: 2
  regime_input_dim: 4
  regime_hidden_dim: 16
  regime_embedding_dim: 12
  regime_count: 4
  soma_hidden_dim: 32
  memory_dim: 24
  head_hidden_dim: 32
  dropout: 0.05
  baseline_hidden_dim: 48
  use_cnn_encoder: true
  cnn_channels: [16, 32]
  cnn_kernel_sizes: [3, 5]
  temporal_blocks: 3
  checkpoint_path: null

risk:
  max_daily_loss: 500.0
  max_position_notional: 5000.0
  max_position_per_symbol: 1
  max_concurrent_positions: 3
  cooldown_sec: 60
  stale_data_sec: 30
  max_spread_bps: 15.0
  duplicate_order_window_sec: 15
  min_trade_confidence: 0.55
  min_trade_fraction: 0.02
  kill_switch: false
  allowed_sessions: []

backtest:
  initial_cash: 100000.0
  fee_bps: 1.0
  slippage_bps: 2.0

training:
  use_real_historical_data: false
  batch_size: 16
  epochs: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  train_split: 0.7
  val_split: 0.2
  test_split: 0.1
  label_epsilon: 0.0005
  checkpoint_dir: checkpoints
  supervised_horizon: 1
  sequence_length: 64
  use_amp: false
  forward_horizons: [1, 5, 15]
  path_label_rules:
    breakout_return_threshold: 0.003
    mean_reversion_return_threshold: 0.0015
    flat_return_threshold: 0.00075
    time_to_move_threshold: 0.002
  class_weight_mode: balanced
  use_weighted_sampler: false
  minority_class_floor_warning: 0.1
  report_target_stats: true
  multitask_enabled: true
  contrastive_enabled: false
  regression_targets:
    - primary_return
    - drawdown
    - stability
  save_memory_after_training: false
  memory_build_split: train

execution:
  max_submit_retries: 2
  retry_backoff_sec: 0.5

memory:
  enabled: false
  build_from_real_checkpoint: false
  latent_dim: null
  top_k: 5
  similarity_metric: cosine
  min_similarity: 0.75
  allow_unknown_state: true
  cluster_method: incremental_prototypes
  max_items: 5000
  rebuild_on_startup: false
  persist_path: artifacts/market_memory.pt
  forward_horizons: [1, 5, 15]
  path_label_rules:
    breakout_return_threshold: 0.003
    mean_reversion_return_threshold: 0.0015
    flat_return_threshold: 0.00075
    time_to_move_threshold: 0.002
  min_cluster_size: 3
  runtime_update_mode: pending_only
  require_strong_match_for_trade: true
  build_history_bars: 320
  min_effective_matches: 2
  attention_temperature: 1.0
  use_hopfield_retrieval: true
  use_esom_map: true
  dynamic_growth_enabled: true
  novelty_mode: quantile
  novelty_quantile: 0.2
  match_calibration_enabled: true
  min_calibrated_match: 0.15
  require_strong_match_for_memory_support: true
  candidate_promotion_mode: support_and_similarity
  min_candidate_support: 3
  max_candidate_age: 128
  merge_enabled: true
  merge_similarity_mode: adaptive
  merge_outcome_consistency_threshold: 0.65
  split_enabled: true
  split_variance_trigger: 0.75
  prune_enabled: true
  utility_decay: 0.995
  min_utility: 0.025
  max_units: 256
  archive_pruned: true
  calibration_enabled: true
  match_conflict_penalty: 0.5
  require_calibrated_strong_match_for_trade_support: true
  topology_neighbor_k: 3
  health_report_enabled: true
  symbol_specific_profiles: false
  regime_specific_profiles: false
  # --- Encoder versioning ---
  require_encoder_match: false
  # --- SatSOM-inspired saturation / plasticity ---
  saturation_enabled: false
  maturity_update_attenuation: 0.95
  # --- Outcome-aware updates ---
  require_outcome_alignment_for_strong_update: false
  # --- Conflict tracking ---
  conflict_tracking_enabled: false
  # --- GNG-inspired topology ---
  graph_growth_enabled: false
  graph_max_edge_age: 100
