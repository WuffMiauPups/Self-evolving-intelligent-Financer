app_name: seif_trading_brain

logging:
  level: INFO
  json: false
  file_enabled: true
  file_path: logs/seif_runtime.log

device:
  preferred: auto
  use_amp: true
  matmul_precision: high
  torch_compile_enabled: false   # opt-in: needs MSVC cl.exe on Windows; set true once env has it

broker:
  provider: alpaca
  paper: true
  live_enabled: false
  confirm_live: false
  require_account_match: true
  base_url: https://paper-api.alpaca.markets
  data_feed: iex
  polling_interval_sec: 2.0
  mock_data_on_missing_credentials: true

# NOTE: broker.base_url default is null in the Python config; the YAML
# explicitly sets it to the paper endpoint.  Left as-is intentionally.

data:
  symbols:
    # ── Mega-cap tech ──
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    # ── Broad-market & sector ETFs ──
    - SPY
    - QQQ
    - VOO
    # ── Single names: fintech / growth / consumer ──
    - PLTR
    - MSTR
    - NFLX
  timeframe: 5Min
  start_date: 2022-01-01
  end_date: null
  cache_dir: artifacts/historical
  force_refresh: false
  max_missing_gap_handling: warn
  timezone_normalization: UTC
  # --- Lookback / bar-count defaults ---
  bars_per_trading_day: 390
  min_lookback_days_minute: 3
  min_lookback_days_hourly: 7
  min_lookback_multiplier_daily: 3
  min_lookback_days_daily: 30
  pipeline:
    chunk_size: monthly
    max_fetch_workers: 4
    retry_count: 3
    retry_backoff_sec: 1.0
    validation_strictness: warn
    max_prep_workers: 4
    manifest_path: artifacts/historical/manifest.json

runtime:
  symbols:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - SPY
    - QQQ
    - VOO
    - PLTR
    - MSTR
    - NFLX
  timeframe: 5Min
  warmup_bars: 48
  decision_interval_sec: 2.0
  # 0 = unbounded (default). Set a positive integer only for bounded debug runs.
  max_runtime_steps: 0
  state_reset_gap_sec: 300
  require_startup_reconciliation: true
  block_on_reconciliation_mismatch: true
  allowed_sessions: ["regular"]
  allow_prepost: false
  max_data_staleness_sec: 1200
  block_on_backwards_time: true
  block_on_data_gap: true
  block_on_symbol_ineligible: false
  require_market_open: true
  # --- Frozen-brain runtime policy ---
  # Model weights are FROZEN at runtime by default.  Memory bank can learn online.
  allow_online_model_updates: false
  allow_online_memory_updates: true
  # Retired symptom patch: forcing FLAT predictions into directional trades
  # papered over cost-blind labels (and was ON in backtests but OFF live,
  # breaking parity). Labels are cost/horizon-aware now; the flag remains
  # only as an explicit experiment knob, consumed identically by backtest
  # and paper runtime.
  force_directional_flip: false
  # Regime hysteresis / market priors: removed in the Great Simplification.
  # Only the top-level enabled flags survive (inert bools so GUI status
  # widgets render "off"); the old sub-keys (thresholds, cooldowns, filters)
  # have no model fields and would be rejected at load.
  regime_hysteresis_enabled: false
  market_priors_enabled: false
  # Alerting
  alert_webhook_url: null
  alert_timeout_sec: 5.0
  # --- Log rotation ---
  log_rotation_max_bytes: 50000000     # 50 MB
  log_rotation_max_backups: 3
  # --- Stream manager ---
  stream_circuit_breaker_limit: 60     # consecutive failures before circuit opens
  stream_empty_poll_warn_frequency: 10 # warn every N empty polls
  # --- Brain policy ---
  default_target_fraction: 0.05        # default position size as fraction of equity
  # --- Parallelism ---
  max_parallel_workers: 8

features:
  windows:
    short: 5
    medium: 20
    long: 60
  volatility_windows: [5, 10, 20]
  momentum_windows: [3, 5, 10]
  volume_windows: [5, 20]
  epsilon: 0.0005
  # Cross-sectional market context (market_* features: SPY/QQQ return+vol,
  # universe breadth, symbol-vs-SPY relative strength).  Flipping this
  # requires retrain ⟲3: the feature contract changes, so checkpoints
  # trained with the other setting refuse to load.
  market_context_enabled: false
  branch_feature_prefixes:
    trend: ["return_", "log_return_", "momentum_", "rsi_", "macd_"]
    volatility: ["volatility_", "range_", "body_", "upper_wick_", "lower_wick_", "atr_"]
    volume: ["volume_", "volume_z_", "volume_change_"]
    regime: ["regime_", "calendar_"]

model:
  feature_dim_hint: 128
  branch_hidden_dim: 128
  branch_output_dim: 96
  branch_depth: 2
  regime_input_dim: 4
  regime_hidden_dim: 64
  regime_embedding_dim: 64
  regime_count: 6
  soma_hidden_dim: 192
  memory_dim: 128
  head_hidden_dim: 192
  head_depth: 2
  dropout: 0.10
  decouple_confidence_from_soma: false
  baseline_hidden_dim: 192
  use_cnn_encoder: true
  cnn_channels: [64, 128, 256]
  cnn_kernel_sizes: [3, 5, 7]
  cnn_dilations: [1, 2, 4]
  temporal_blocks: 3
  checkpoint_path: checkpoints/brain.pt  # canonical trained checkpoint
  # --- Ablation flags (all true = full model) ---
  regime_encoder_enabled: true
  latent_gru_memory_enabled: true
  branch_confidence_gating_enabled: true
  soma_confidence_weighting_enabled: true
  regime_prototype_init_scale: 0.02    # scale for regime embedding initialization
  separate_risk_heads: true           # Dedicated heads for MFE/MAE/volatility/drawdown (feed the EV gate)
  # --- Head disentanglement (Phase 2 §6.1) ---
  # confidence = softmax P(chosen class), sizing not learned (risk layer owns
  # it), per-horizon return heads replace the shared return scalar. Old
  # checkpoints reconstruct their legacy architecture from their own saved
  # config regardless of these values.
  decoupled_heads: true
  return_head_horizons: []             # synced to training horizons at train time

risk:
  max_daily_loss: 350.0
  max_daily_loss_pct: null       # percentage of equity; overrides absolute when set
  max_position_notional: 12000.0
  max_aggregate_notional: 50000.0
  max_leverage_ratio: 2.0
  max_position_per_symbol: 3
  max_concurrent_positions: 15
  max_rolling_drawdown: -0.10    # -10% rolling drawdown limit
  rolling_drawdown_window: 100
  cooldown_sec: 60
  # MUST exceed the bar period (runtime.timeframe 5Min = 300s): a bar's
  # timestamp is its bucket START, so it ages to a full period by bucket
  # close — normal data, not stale. The old 30s blocked ~90% of live
  # decisions with stale_data (found in the 2026-07-15 paper run; the
  # AppConfig validator now refuses any value below the bar period).
  stale_data_sec: 420
  max_spread_bps: 100.0
  duplicate_order_window_sec: 15
  # min_trade_confidence / min_trade_fraction removed (Great Simplification
  # Phase 7). Trade gating is now EV-based: the risk manager computes
  # (confidence * expected_gain_bps - (1-confidence) * expected_loss_bps - cost_bps)
  # and approves only when the result is positive. fee_bps + slippage_bps below
  # feed the cost side; expected_gain_bps / expected_loss_bps come from the
  # model's risk head (MFE / MAE predictions in bps).
  fee_bps: 1.0
  slippage_bps: 2.0
  # Refuse to build a brain policy around a checkpoint without a risk head
  # (the EV gate would see (0,0) and silently reject every trade). §4.4.4.
  ev_gate_requires_signals: true
  quantity_precision: 0.001
  kill_switch: false
  allowed_sessions: []
  # --- Deduplication ---
  max_processed_request_ids: 100000   # cap on seen request ID set
  # --- Outcome-adaptive risk budget (Phase 2 §6.4) ---
  # Realized rolling drawdown throttles risk-INCREASING size: multiplier 1.0
  # at zero drawdown, linear to budget_min_multiplier at
  # budget_full_at_drawdown. Risk-reducing trades are never throttled.
  # Logged on every decision (budget_multiplier).
  adaptive_budget_enabled: false
  budget_min_multiplier: 0.25
  budget_full_at_drawdown: -0.05

backtest:
  initial_cash: 100000.0
  fee_bps: 1.0
  slippage_bps: 2.0
  # Decisions on bar t fill at bar t+1's open (a decision cannot execute
  # at the close it just observed). "same_close" = legacy optimistic mode.
  fill_timing: next_open
  # --- Annualization / simulation timing ---
  bars_per_year: 19656                # 252 days * 78 five-min bars
  seconds_per_bar: 300.0

training:
  use_real_historical_data: true
  seed: 7                             # training RNG seed; vary per sweep run
  batch_size: 384
  epochs: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler_type: cosine
  # --- Extended scheduler controls ---
  scheduler_warmup_epochs: 0
  scheduler_patience: 2               # for ReduceLROnPlateau
  scheduler_factor: 0.5               # for ReduceLROnPlateau
  scheduler_min_lr: 0.000001
  scheduler_t_max: null               # for CosineAnnealingLR; defaults to epochs if null
  train_split: 0.7
  val_split: 0.2
  test_split: 0.1
  label_epsilon: 0.0005
  # --- Adaptive label epsilon (per-symbol volatility scaling) ---
  adaptive_label_epsilon: true
  adaptive_epsilon_multiplier: 1.0
  adaptive_epsilon_min: 0.0001
  adaptive_epsilon_max: 0.005
  checkpoint_dir: checkpoints
  sequence_length: 48
  use_amp: true
  forward_horizons: [1, 3, 6]
  # --- Horizon / target head controls ---
  primary_direction_horizon: null      # defaults to max(forward_horizons) if null
  auxiliary_horizons: []               # extra horizons for future-path targets
  enable_future_return_targets: true
  enable_risk_path_targets: true       # MFE/MAE/volatility/drawdown regression
  path_label_rules:
    breakout_return_threshold: 0.003
    mean_reversion_return_threshold: 0.0015
    flat_return_threshold: 0.00075
    time_to_move_threshold: 0.002
  # Class imbalance: exactly ONE primary correction (balanced class
  # weights). Focal loss and the weighted sampler stack multiplicatively
  # with the weights when combined (2-3x over-correction of the prior,
  # pushing predictions far from base rates) - opt-in experiments only.
  classification_loss: cross_entropy  # "focal" is opt-in
  focal_gamma: 2.0
  adaptive_focal_gamma: false
  focal_gamma_base: 1.5
  focal_gamma_boost: 2.0
  label_smoothing: 0.0
  class_weight_mode: balanced
  class_weight_cap: 3.0               # max class weight; null = uncapped
  use_weighted_sampler: false         # opt-in; stacks with class weights
  weighted_sampler_mode: inverse_frequency  # or "effective_number"
  # Best-epoch / early-stopping selection metric. Raw val loss rewards
  # flat-hedging; balanced accuracy is what the scorecard grades.
  model_selection_metric: val_balanced_accuracy
  minority_class_floor_warning: 0.1
  report_target_stats: true
  # --- Extended training diagnostics ---
  report_logit_stats: true
  report_prediction_distribution: true
  report_per_class_metrics: true
  inspect_target_boundaries: true
  # --- Diagnostic thresholds (class_balance / metrics) ---
  label_epsilon_min_bars: 20           # min bars for adaptive epsilon estimation
  near_flat_multiplier: 1.25
  epsilon_reduction_factor: 0.5
  flat_dominance_threshold: 0.80       # warn if FLAT share exceeds this
  metrics_flat_dominance_threshold: 0.75
  multitask_enabled: true
  contrastive_enabled: false             # RESERVED
  contrastive_margin: 0.1               # RESERVED
  # --- Loss weights (path_label head removed — 5-class task didn't earn its keep,
  # train→val gap was 7.7pt, val acc below majority baseline) ---
  loss_weights:
    classification: 1.0
    regression: 0.35
    latent: 0.10
    future_return: 0.20
    risk_path: 0.15
  regression_targets:
    - primary_return
    - drawdown
    - stability
  # --- Collapse detection thresholds ---
  collapse_warning_thresholds:
    long_prediction_floor: 0.08
    minority_recall_floor: 0.15
  # --- Task disabling flags ---
  disable_regression: false
  disable_latent: false
  # --- Run output ---
  runs_dir: runs
  # (sequential_memory_training / memory_truncation_steps removed — the
  # sequential-GRU training path was never implemented; no model fields.)
  save_memory_after_training: true
  memory_build_split: train
  early_stopping_patience: 2          # stop training if val loss degrades for 2 consecutive epochs
  restore_best_model: true            # Restore best epoch weights after training
  # Round-trip cost floor for the FLAT band: a move smaller than the
  # cost can never be worth trading, so it must not be labeled
  # directional. Kept IDENTICAL to the backtest fill cost by contract
  # (§4.4.2): 2 * (backtest.fee_bps + backtest.slippage_bps) — asserted
  # by tests/test_label_quality.py::test_label_cost_matches_backtest_costs.
  transaction_cost_bps: 6.0
  platt_calibration_enabled: true     # Fit Platt scaling on validation set after training
  # --- RL fine-tuning (reserved scaffold) ---
  rl_finetune_enabled: false
  rl_finetune_episodes: 100
  rl_replay_buffer_capacity: 10000
  rl_gamma: 0.99
  rl_batch_size: 32
  rl_learning_rate: 0.0001
  # --- Self-supervised pretraining (reserved scaffold) ---
  pretrain_enabled: false
  pretrain_epochs: 5
  pretrain_learning_rate: 0.0005
  # --- Retrain trigger (self-evolution loop, MASTER_PLAN 4.5.3) ---
  # Per-metric drift thresholds evaluated against the persisted outcome
  # stream (scripts/run_train.py --check-retrain-trigger). A 0.5 Sharpe
  # drop and a 5pt win-rate drop are comparable alarms; a shared
  # threshold conflates noise (Sharpe) with catastrophe (win rate).
  retrain_triggers:
    sharpe_drop: 0.5
    win_rate_drop: 0.05
    min_observations: 200
  # --- Forgetting-safe retraining (4.5.6): anchor to the incumbent ---
  anchor_checkpoint_path: null   # incumbent checkpoint to anchor against
  distill_lambda_kd: 0.0         # KL(incumbent || student) weight; 0 = off
  proximal_lambda_l2: 0.0        # L2(student - anchor) weight; 0 = off
  # --- Curriculum + anchored negatives (Phase 2 6.5), both off by default ---
  # Curriculum: epoch-progressive sampler admits easy (unambiguous-label)
  # samples first, ramping to the full set by curriculum_full_epoch.
  curriculum_enabled: false
  curriculum_start_quantile: 0.5
  curriculum_full_epoch: 3
  # Anchored negatives: the worst executed decisions (loss > round-trip cost
  # + noise buffer) are retained permanently across retrains.
  anchored_negatives_enabled: false
  anchored_negatives_path: runs/anchored_negatives.jsonl
  anchored_negatives_max: 5000
  anchored_noise_buffer_bps: 5.0
  # --- Fast experiment mode (disabled by default) ---
  # Enable with --fast CLI flag or by setting enabled: true here.
  # Fast runs are explicitly marked in logs and run summaries.
  # Do NOT promote a fast-mode checkpoint to production.
  fast_mode:
    enabled: false
    sample_seed: 42
    fast_months: 6
    fast_start_date: null              # explicit ISO start override
    fast_end_date: null                # explicit ISO end override
    symbols: [AAPL, MSFT, NVDA, SPY, QQQ]
    max_train_samples: 50000
    max_val_samples: 15000
    max_test_samples: 10000
    max_epochs: null                   # cap epochs; min of this and training.epochs
    # --- Target/loss simplification ---
    disable_future_return: false
    disable_risk_path: false
    model_profile: default             # "default" or "small" (reduced capacity)

execution:
  max_submit_retries: 2
  retry_backoff_sec: 0.5
  order_journal_enabled: true
  order_journal_path: "runs/order_journal.jsonl"
  # --- Journal rotation ---
  order_journal_max_bytes: 50000000   # 50 MB
  order_journal_max_backups: 3
  # --- Durable outcome dataset (the self-evolution loop's raw material) ---
  ledger_persist_enabled: true
  ledger_persist_path: "runs/fills.jsonl"
  decision_log_enabled: true
  decision_log_path: "runs/decisions.jsonl"
  # Per-decision outcome stream (4.5.3): the retrain drift trigger's live
  # data source. One DecisionObservation per executed fill; read back by
  # scripts/run_train.py --check-retrain-trigger.
  observation_stream_enabled: true
  observation_stream_path: "runs/observations.jsonl"

memory:
  enabled: true
  build_from_real_checkpoint: true
  latent_dim: null
  top_k: 5
  similarity_metric: cosine
  max_items: 20000     # stratified per-symbol: 13 symbols * ~1.5K items each — small for fast retrieval at backtest time
  rebuild_on_startup: false
  persist_path: artifacts/market_memory.pt
  # forward_horizons intentionally NOT set here: AppConfig auto-syncs
  # memory.forward_horizons from training.forward_horizons unless the
  # memory side explicitly overrides it (see src/core/config/app.py).
  # An explicit list here would silently break training<->memory label
  # parity whenever training.forward_horizons changes.
  path_label_rules:
    breakout_return_threshold: 0.003
    mean_reversion_return_threshold: 0.0015
    flat_return_threshold: 0.00075
    time_to_move_threshold: 0.002
  runtime_update_mode: pending_only
  build_history_bars: 320
  # --- Encoder versioning ---
  require_encoder_match: true
  # --- Pending observation persistence ---
  persist_pending_observations: true
  pending_store_path: artifacts/pending_observations.pt
  save_debounce_sec: 300.0             # bank/pending saved at most once per interval (plus at shutdown)
  pending_max_per_symbol: 2048         # oldest pending observations dropped (loudly) beyond this
  # --- Bounded memory influence (Phase 2 §6.2) ---
  # damping: kNN outcome stats can only SHRINK a trade (multiplier in
  # [damping_min_multiplier, 1.0]) — never grow, flip, veto, or touch
  # confidence. Keep "off" until the counterfactual credit gate is positive.
  influence_mode: "off"
  damping_min_multiplier: 0.5
  damping_min_neighbors: 5
  damping_full_at_return: 0.002

# --- Strategy arbitration layer (MASTER_PLAN §6.3) ---
# Registry of brain + bounded rule primitives: every strategy proposes each
# bar, the highest-weight directional candidate wins and is scaled by its
# budget fraction (the SOFT cap); realized fill PnL shifts the weights.
# Disabled by default — PAPER-ONLY until an arbitrated run beats the
# brain-only scorecard row (SCORECARD.md).
arbitration:
  enabled: false
  strategies: [brain, momentum, mean_reversion]
  budget_fractions:
    brain: 1.0
    momentum: 0.5
    mean_reversion: 0.5
  ema_alpha: 0.1        # per-strategy realized-PnL EMA smoothing
  weight_floor: 0.05    # nonzero floor weight: losers are throttled, never starved

# --- Evaluation / experiment framework ---
evaluation:
  seed: 42
  output_dir: experiments
  walk_forward:
    train_bars: 5000
    val_bars: 1000
    test_bars: 1000
    step_bars: 1000
    window_type: rolling
    min_train_bars: 2000
    reset_memory_per_fold: true
  # --- Scorecard-judged promotion (MASTER_PLAN 4.5.5 / 4.5.7) ---
  # A candidate must beat the incumbent's benchmark row (balanced
  # accuracy AND expectancy) by more than these deltas AND beat
  # buy-and-hold; no frozen held-out slice may degrade by more than
  # backward_transfer_floor.
  promotion:
    min_balanced_accuracy_delta: 0.0
    min_expectancy_delta: 0.0
    min_excess_vs_buy_hold: 0.0
    backward_transfer_floor: 0.05
    # Slice producer (4.5.7): the shared OOS window is cut into this many
    # chronological regime slices for the backward-transfer gate; slices
    # with fewer decisions than the minimum (either checkpoint) are skipped.
    backward_transfer_slices: 4
    backward_transfer_min_decisions: 50
